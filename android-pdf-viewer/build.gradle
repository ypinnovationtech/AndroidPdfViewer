plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.github.barteksc'
version = '3.2.6'

android {
    namespace 'com.github.barteksc.pdfviewer'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "3.2.6"
        consumerProguardFiles "consumer-rules.pro"
    }

    lint {
        abortOnError false
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.core:core:1.13.1'
    api 'com.github.barteksc:pdfium-android:1.9.0'
}

afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from(components["release"])
                groupId = "com.github.barteksc"
                artifactId = "android-pdf-viewer"
                version = "3.2.6"

                pom {
                    name.set("AndroidPdfViewer")
                    description.set("A fast PDF rendering library for Android")
                    url.set("https://github.com/ypinnovationtech/AndroidPdfViewer")
                    licenses {
                        license {
                            name.set("MIT License")
                            url.set("https://opensource.org/licenses/MIT")
                        }
                    }
                    developers {
                        developer {
                            id.set("barteksc")
                            name.set("Bartek Chichoki")
                        }
                    }
                    scm {
                        url.set("https://github.com/ypinnovationtech/AndroidPdfViewer")
                    }
                }
            }
        }
    }
}
