plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.github.barteksc'
version = '3.2.5'

android {
    namespace 'com.github.barteksc.pdfviewer'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 2
        versionName "3.2.5"
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    api 'com.github.barteksc:pdfium-android:1.9.0'
}

afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from components.release
                groupId = 'com.github.barteksc'
                artifactId = 'android-pdf-viewer'
                version = '3.2.5'
            }
        }
        repositories {
            maven {
                url = uri("$buildDir/repo")
            }
            maven {
                url = uri("$buildDir/outputs/repo")
            }
        }
    }
}
